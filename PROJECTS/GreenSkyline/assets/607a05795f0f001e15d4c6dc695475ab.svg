<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="300.5" height="300.5" viewBox="0,0,300.5,300.5"><g transform="translate(-89.75,-29.75)"><g data-paper-data="{&quot;isPaintingLayer&quot;:true}" fill-rule="nonzero" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" style="mix-blend-mode: normal"><path d="M91,329v-298h298v298z" fill-opacity="0.67742" fill="#56c929" stroke="#ffffff" stroke-width="2.5"/><text transform="translate(97.5,317.96573) scale(0.41234,0.41234)" font-size="40" xml:space="preserve" fill="#ffffff" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">left/right arrow to go through pages</tspan></text><text transform="translate(123.5,72) scale(0.5,0.5)" font-size="40" xml:space="preserve" fill="#ffffff" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">Chapter9: Disasters</tspan></text><text transform="translate(100.08519,105.7821) scale(0.5,0.5)" font-size="40" xml:space="preserve" fill="#ffffff" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="&quot;ヒラギノ角ゴ Pro W3&quot;, &quot;Hiragino Kaku Gothic Pro&quot;, Osaka, &quot;メイリオ&quot;, Meiryo, &quot;ＭＳ Ｐゴシック&quot;, &quot;MS PGothic&quot;" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">Every approximately 250 seconds</tspan><tspan x="0" dy="48px">a disaster happens. It Could be </tspan><tspan x="0" dy="48px">Either a heatwave or flash flood. </tspan><tspan x="0" dy="48px">It happens because of natural </tspan><tspan x="0" dy="48px">causes. But we can delay it</tspan><tspan x="0" dy="48px">by using green energy or schools.</tspan><tspan x="0" dy="48px">Floods could be stopped with a </tspan><tspan x="0" dy="48px">seawall</tspan></text></g></g></svg>