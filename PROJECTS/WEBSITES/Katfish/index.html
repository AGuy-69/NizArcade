<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Katfish</title>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1f26;--pnl:#15323b;--ink:#e8f1ec;--dim:#8fb0b0;--ck:#f2b45a;--red:#c4504a;--ok:#7fd1a0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:600 15px Nunito,system-ui,sans-serif}
#app{max-width:680px;margin:0 auto;padding:10px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
h1{font:28px 'Bowlby One',Impact,sans-serif;margin:0;letter-spacing:1px;color:var(--ck)}
#k{font-weight:800;font-size:20px}
canvas{width:100%;display:block;border-radius:12px;margin-top:8px;cursor:crosshair;touch-action:manipulation;background:#123}
#cd{height:8px;background:#0a1519;border-radius:5px;margin-top:6px;overflow:hidden}#cd i{display:block;height:100%;width:100%;background:var(--ok)}
#msg{min-height:22px;margin:6px 0;color:var(--dim)}#msg.eerie{color:var(--red);font-style:italic}
nav{display:flex;gap:6px}nav button{flex:1}
button{font:800 14px Nunito,sans-serif;background:var(--pnl);color:var(--ink);border:2px solid #2b5560;border-radius:10px;padding:9px 10px;cursor:pointer}
button.on{background:var(--ck);color:#2a1a05;border-color:var(--ck)}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible{outline:3px solid var(--ok)}
#panel{background:var(--pnl);border-radius:12px;padding:10px;margin-top:8px}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #24464f}.row:last-child{border:0}
.row img{width:54px;height:54px;object-fit:contain;background:#0d2229;border-radius:8px}
.row div{flex:1}.row small{display:block;color:var(--dim);font-weight:600;line-height:1.3}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body><div id="app">
<header><h1>KATFISH</h1><div id="k">🍪 0</div></header>
<canvas id="c" width="640" height="360" aria-label="Pond. Click the water to fish."></canvas>
<div id="cd"><i></i></div><div id="msg">Click the water. Fish where the bubbles are.</div>
<nav><button data-t="sell">Sell</button><button data-t="up">Upgrades</button><button data-t="cats">Cats</button></nav>
<div id="panel"></div></div>

function beep(f,d,ty){try{const a=beep.a||(beep.a=new AudioContext()),o=a.createOscillator(),v=a.createGain();o.type=ty||'sine';o.frequency.value=f;v.gain.value=.06;o.connect(v);v.connect(a.destination);o.start();v.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.stop(a.currentTime+d)}catch(e){}}
function bang(){try{const a=beep.a||(beep.a=new AudioContext()),n=a.createBuffer(1,4000,8000),d=n.getChannelData(0);for(let i=0;i<4000;i++)d[i]=(Math.random()*2-1)*(1-i/4000);const s=a.createBufferSource(),v=a.createGain();v.gain.value=.15;s.buffer=n;s.connect(v);v.connect(a.destination);s.start()}catch(e){}}

function fish(x,y,junk){const c=cat();let q=c.q*(1+.1*S.up.lure)*(.7+Math.random()*.6),f=pick();
 if(junk){f=['Soggy Boot',1];q=1}else if(S.cat=='nyan'){f=['Wildcard '+f[0],f[1]*30]}
 else if(S.cat=='stare'&&Math.random()<.1){f=['??? (it blinked)',80];q=1;msg('Mr. Stare caught something. It was already looking back.',1)}
 const v=Math.max(1,Math.round(f[1]*q));const lost=S.cat=='happy'&&!junk&&f[1]<=8&&Math.random()<.4,f2=S.cat=='dead'&&!junk?pick():null,done=()=>{if(lost){fl.push({t:'WHOOSH! The fish flew away',x:175,y:90,a:0,c:'#ff9ad5'});return}if(PROC[S.cat]){startProc(f[0],v);return}S.fish.push({n:f[0],v});if(f2)S.fish.push({n:f2[0],v:Math.max(1,Math.round(f2[1]*q))});

function bubbleAt(x,y){const R=38*(1+.15*S.up.eyes)*(S.cat=='astro'?1.5:PROC[S.cat]?1.8:1);let b=null,bd=1e9;

  h+=S.fish.slice(-6).reverse().map(f=>`<div class="row"><div>${f.n}<small>worth ~${f.v}</small></div></div>`).join('')||'<small>Your bag is empty. Wait for bubbles.</small>'}

function sell(){const t=Math.round(S.fish.reduce((a,f)=>a+f.v,0)*(1+.15*S.up.dough));S.k+=t;S.fish=[];save();beep(800,.2,'triangle');msg('Sold for '+t+' kookies. The cookie-cats nod.');panel()}
